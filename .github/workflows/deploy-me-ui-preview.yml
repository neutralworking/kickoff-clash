name: Build ME UI Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Build UI preview
        env:
          NEXT_PUBLIC_BASE_PATH: /kickoff-clash/preview/me-ui-pass-01
        run: npm run build

# Publishing is intentionally handled by the main-branch GitHub Pages workflow,
# which nests this branch under /preview/me-ui-pass-01 without weakening the
# github-pages environment protection rule.