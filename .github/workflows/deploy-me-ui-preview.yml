name: Deploy ME UI Preview

on:
  push:
    branches: [agent/v8-me-ui-pass-01]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-site
      - name: Checkout UI preview
        uses: actions/checkout@v4
        with:
          ref: agent/v8-me-ui-pass-01
          path: preview-site
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            main-site/package-lock.json
            preview-site/package-lock.json
      - name: Build main site
        working-directory: main-site
        env:
          NEXT_PUBLIC_BASE_PATH: /kickoff-clash
        run: |
          npm ci
          npm run build
      - name: Build UI preview
        working-directory: preview-site
        env:
          NEXT_PUBLIC_BASE_PATH: /kickoff-clash/preview/me-ui-pass-01
        run: |
          npm ci
          npm run build
      - name: Add UI preview to Pages artifact
        run: |
          mkdir -p main-site/out/preview/me-ui-pass-01
          cp -R preview-site/out/. main-site/out/preview/me-ui-pass-01/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: main-site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
