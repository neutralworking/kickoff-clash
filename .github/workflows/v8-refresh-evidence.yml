name: Refresh V8 Evidence

on:
  push:
    branches:
      - claude/generated-tactical-window-6dxfay
    paths:
      - '.github/workflows/v8-refresh-evidence.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/generated-tactical-window-6dxfay
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Regenerate deterministic matrix evidence
        run: npx vitest run src/engine-v8/__tests__/calibration-matchup-matrix.test.ts src/engine-v8/__tests__/calibration-matchup-periods.test.ts
      - name: Commit refreshed evidence and remove helper
        shell: bash
        run: |
          git config user.name 'Neutral Working'
          git config user.email '13trianglez@gmail.com'
          git rm .github/workflows/v8-refresh-evidence.yml
          git add test-results/v8-calibration-matrix.json test-results/v8-calibration-matrix.txt test-results/v8-calibration-periods.json test-results/v8-calibration-periods.txt
          git commit -m 'Refresh V8 set-piece calibration evidence'
          git push origin HEAD:claude/generated-tactical-window-6dxfay
