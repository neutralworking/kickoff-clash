name: Deploy to GitHub Pages

# Builds the Next.js static export and publishes it to GitHub Pages.
# The runner has internet, so next/font/google self-hosts the fonts at build time
# (no offline swap needed). Serves at https://neutralworking.github.io/kickoff-clash/
# To serve from a custom domain root (chief-scout.com): set the Pages custom domain,
# point DNS at GitHub Pages, set NEXT_PUBLIC_BASE_PATH to "" below, and add a CNAME.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: /kickoff-clash
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
