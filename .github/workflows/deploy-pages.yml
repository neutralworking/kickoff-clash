name: Deploy to GitHub Pages

# Builds the live main export plus isolated V8 previews and publishes them together.
# The live game remains at /kickoff-clash/; previews are nested under /kickoff-clash/preview/
# so preview publishing never replaces the root app.
# ME UI preview verified head: c99247fd69947aca4512ce57779a450fd9d33309

on:
  push:
    branches:
      - main
      - agent/v8-three-zone-prototype
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install live dependencies
        run: npm ci

      - name: Build live static export
        env:
          NEXT_PUBLIC_BASE_PATH: /kickoff-clash
        run: npm run build

      - name: Checkout V8 prototype
        uses: actions/checkout@v4
        with:
          ref: agent/v8-three-zone-prototype
          path: preview-src

      - name: Install V8 preview dependencies
        working-directory: preview-src
        run: npm ci

      - name: Build V8 preview static export
        working-directory: preview-src
        env:
          NEXT_PUBLIC_BASE_PATH: /kickoff-clash/preview/v8
        run: npm run build

      - name: Nest V8 preview inside live Pages artifact
        run: |
          mkdir -p out/preview/v8
          cp -R preview-src/out/. out/preview/v8/

      - name: Checkout ME UI preview
        uses: actions/checkout@v4
        with:
          ref: agent/v8-me-ui-pass-01
          path: me-ui-preview-src

      - name: Install ME UI preview dependencies
        working-directory: me-ui-preview-src
        run: npm ci

      - name: Build ME UI preview static export
        working-directory: me-ui-preview-src
        env:
          NEXT_PUBLIC_BASE_PATH: /kickoff-clash/preview/me-ui-pass-01
        run: npm run build

      - name: Nest ME UI preview inside live Pages artifact
        run: |
          mkdir -p out/preview/me-ui-pass-01
          cp -R me-ui-preview-src/out/. out/preview/me-ui-pass-01/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4