name: V8 Cross Modifier Sensitivity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Sweep compact Cross modifier candidates
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/engine-v8/calibration-runtime.ts

          run_scenario() {
            local name="$1"
            local rabona="$2"
            local bend="$3"
            local wambach_att="$4"
            git checkout -- "$FILE"
            RABONA="$rabona" BEND="$bend" WAMBACH_ATT="$wambach_att" python - <<'PY'
          import os
          from pathlib import Path
          path = Path('src/engine-v8/calibration-runtime.ts')
          text = path.read_text()
          replacements = {
              "if (!modifyFirstCrossMutable(state, player.side, 3))": f"if (!modifyFirstCrossMutable(state, player.side, {os.environ['RABONA']}))",
              "generateTacticalMutable(state, player.side, 'cross', card.id, { attModifier: 2 });": f"generateTacticalMutable(state, player.side, 'cross', card.id, {{ attModifier: {os.environ['BEND']} }});",
              "const amount = zone === 'ATT' ? 4 : 3;": f"const amount = zone === 'ATT' ? {os.environ['WAMBACH_ATT']} : 3;",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected runtime source not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
            rm -rf test-results
            npx vitest run src/engine-v8/__tests__/calibration-matchup-matrix.test.ts src/engine-v8/__tests__/calibration-cross-minimal.test.ts
            mkdir -p "sensitivity/$name"
            cp test-results/v8-calibration-matrix.json test-results/v8-calibration-matrix.txt "sensitivity/$name/"
            cp test-results/v8-calibration-cross-minimal.json test-results/v8-calibration-cross-minimal.txt "sensitivity/$name/"
          }

          run_scenario rabona2 2 2 4
          run_scenario bend1 3 1 4
          run_scenario wambach3 3 2 3
          run_scenario rabona2_wambach3 2 2 3
          run_scenario bend1_rabona2 2 1 4
          run_scenario bend1_wambach3 3 1 3

          git checkout -- "$FILE"

      - name: Upload sensitivity evidence
        uses: actions/upload-artifact@v4
        with:
          name: v8-cross-modifier-sensitivity
          path: sensitivity/
          if-no-files-found: error
          retention-days: 7
