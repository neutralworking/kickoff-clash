name: V8 Cross Reference Sensitivity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      - name: Sweep compact Cross reference XIs
        shell: bash
        run: |
          set -euo pipefail
          BALANCE=src/engine-v8/calibration-balance.ts
          SQUADS=src/engine-v8/calibration-squads.ts
          ORIGINAL_BALANCE=$(cat "$BALANCE")
          ORIGINAL_SQUADS=$(cat "$SQUADS")

          apply_costs() {
            python - <<'PY'
          from pathlib import Path
          path = Path('src/engine-v8/calibration-balance.ts')
          text = path.read_text()
          old = "export function calibrationPlayCost(card: Pick<V8CalibrationPlayerCard, 'cost'>): number {\n  return Math.max(1, card.cost - 1);\n}"
          new = "export function calibrationPlayCost(card: Pick<V8CalibrationPlayerCard, 'id' | 'cost'>): number {\n  if (card.id === 'wambach' || card.id === 'di-maria') return Math.max(1, card.cost);\n  return Math.max(1, card.cost - 1);\n}"
          if old not in text:
              raise SystemExit('calibrationPlayCost source did not match expected baseline')
          path.write_text(text.replace(old, new))
          PY
          }

          run_candidate() {
            local name="$1"
            local ids="$2"
            printf '%s' "$ORIGINAL_BALANCE" > "$BALANCE"
            printf '%s' "$ORIGINAL_SQUADS" > "$SQUADS"
            apply_costs
            CROSS_IDS="$ids" python - <<'PY'
          import os
          from pathlib import Path
          path = Path('src/engine-v8/calibration-squads.ts')
          text = path.read_text()
          start = text.index("  cross: {")
          ids_start = text.index("    playerIds: [", start)
          ids_end = text.index("    ],", ids_start) + len("    ],")
          ids = [item for item in os.environ['CROSS_IDS'].split(',') if item]
          block = "    playerIds: [\n" + ''.join(f"      '{item}',\n" for item in ids) + "    ],"
          path.write_text(text[:ids_start] + block + text[ids_end:])
          PY
            rm -rf test-results
            npx vitest run --testTimeout 30000 \
              src/engine-v8/__tests__/calibration-matchup-matrix.test.ts \
              src/engine-v8/__tests__/calibration-deck-validation.test.ts \
              src/engine-v8/__tests__/calibration-compact-core.test.ts
            mkdir -p "sensitivity/$name"
            cp test-results/v8-calibration-matrix.* "sensitivity/$name/"
            cp test-results/v8-calibration-deck-validation.* "sensitivity/$name/"
            cp test-results/v8-calibration-compact-core.* "sensitivity/$name/"
          }

          run_candidate core3 "beckham,wambach,di-maria,schmeichel,gentile,seedorf,iniesta,beckenbauer,makelele,bremner,sinclair"
          run_candidate core4 "beckham,wambach,di-maria,dzajic,schmeichel,gentile,seedorf,iniesta,beckenbauer,makelele,bremner"

          printf '%s' "$ORIGINAL_BALANCE" > "$BALANCE"
          printf '%s' "$ORIGINAL_SQUADS" > "$SQUADS"

      - name: Upload sensitivity evidence
        uses: actions/upload-artifact@v4
        with:
          name: v8-cross-reference-sensitivity
          path: sensitivity/
          if-no-files-found: error
          retention-days: 7
