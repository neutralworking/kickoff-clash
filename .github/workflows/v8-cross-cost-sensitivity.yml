name: V8 Cross Structural Sensitivity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Apply Wambach Cost and tempo RABONA sensitivity
        shell: python
        run: |
          from pathlib import Path

          balance = Path('src/engine-v8/calibration-balance.ts')
          text = balance.read_text()
          old = "export function calibrationPlayCost(card: Pick<V8CalibrationPlayerCard, 'cost'>): number {\n  return Math.max(1, card.cost - 1);\n}"
          new = "export function calibrationPlayCost(card: Pick<V8CalibrationPlayerCard, 'id' | 'cost'>): number {\n  if (card.id === 'wambach') return Math.max(1, card.cost);\n  return Math.max(1, card.cost - 1);\n}"
          if old not in text:
              raise SystemExit('calibrationPlayCost source did not match expected baseline')
          balance.write_text(text.replace(old, new))

          runtime = Path('src/engine-v8/calibration-runtime.ts')
          text = runtime.read_text()
          old = """function modifyFirstCrossMutable(state: V8CalibrationState, side: V8CalibrationSide, amount: number): boolean {
            const entry = state.teams[side].hand.find((candidate) => candidate.kind === 'tactical' && candidate.card.type === 'cross');
            if (!entry || entry.kind !== 'tactical') return false;
            entry.card.attModifier += amount;
            pushEvent(state, 'tactical_modified', `${entry.card.name} in hand gains +${amount} ATT.`);
            return true;
          }"""
          new = """function modifyFirstCrossMutable(state: V8CalibrationState, side: V8CalibrationSide, _amount: number): boolean {
            const entry = state.teams[side].hand.find((candidate) => candidate.kind === 'tactical' && candidate.card.type === 'cross');
            if (!entry || entry.kind !== 'tactical') return false;
            entry.card.metadata.freeThroughPeriod = state.period;
            pushEvent(state, 'tactical_modified', `${entry.card.name} in hand costs 0 this period.`);
            return true;
          }"""
          if old not in text:
              raise SystemExit('modifyFirstCrossMutable source did not match expected baseline')
          runtime.write_text(text.replace(old, new))

      - name: Add zero-card and single-card Cross controls
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/engine-v8/calibration-cross-minimal.ts')
          text = path.read_text()
          old = """const CORE_CASES = [
            { id: 'beckham-wambach', core: ['beckham', 'wambach'] },
            { id: 'di-maria-wambach', core: ['di-maria', 'wambach'] },
            { id: 'dzajic-wambach', core: ['dzajic', 'wambach'] },
            { id: 'beckham-di-maria', core: ['beckham', 'di-maria'] },
            { id: 'beckham-di-maria-wambach', core: ['beckham', 'di-maria', 'wambach'] },
            { id: 'beckham-dzajic-wambach', core: ['beckham', 'dzajic', 'wambach'] },
            { id: 'di-maria-dzajic-wambach', core: ['di-maria', 'dzajic', 'wambach'] },
            { id: 'beckham-di-maria-dzajic', core: ['beckham', 'di-maria', 'dzajic'] },
          ] as const;"""
          new = """const CORE_CASES = [
            { id: 'neutral', core: [] },
            { id: 'beckham', core: ['beckham'] },
            { id: 'wambach', core: ['wambach'] },
            { id: 'di-maria', core: ['di-maria'] },
            { id: 'dzajic', core: ['dzajic'] },
            { id: 'beckham-wambach', core: ['beckham', 'wambach'] },
            { id: 'di-maria-wambach', core: ['di-maria', 'wambach'] },
            { id: 'dzajic-wambach', core: ['dzajic', 'wambach'] },
            { id: 'beckham-di-maria', core: ['beckham', 'di-maria'] },
            { id: 'beckham-di-maria-wambach', core: ['beckham', 'di-maria', 'wambach'] },
            { id: 'beckham-dzajic-wambach', core: ['beckham', 'dzajic', 'wambach'] },
            { id: 'di-maria-dzajic-wambach', core: ['di-maria', 'dzajic', 'wambach'] },
            { id: 'beckham-di-maria-dzajic', core: ['beckham', 'di-maria', 'dzajic'] },
          ] as const;"""
          if old not in text:
              raise SystemExit('CORE_CASES source did not match expected baseline')
          path.write_text(text.replace(old, new))

      - name: Create neutral reporter
        shell: bash
        run: |
          cat > src/engine-v8/__tests__/tmp-cross-neutral-control.test.ts <<'EOF'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { describe, it } from 'vitest';
          import {
            V8_CROSS_MINIMAL_SEEDS,
            formatV8CrossMinimalReport,
            runV8CrossMinimalSensitivity,
          } from '../calibration-cross-minimal';

          describe('V8 Cross neutral shell control', () => {
            it('writes zero/single/pair/triple evidence', () => {
              const report = runV8CrossMinimalSensitivity(V8_CROSS_MINIMAL_SEEDS);
              const text = formatV8CrossMinimalReport(report);
              mkdirSync('test-results', { recursive: true });
              writeFileSync('test-results/v8-calibration-cross-neutral-control.json', `${JSON.stringify(report, null, 2)}\n`);
              writeFileSync('test-results/v8-calibration-cross-neutral-control.txt', `${text}\n`);
            }, 30_000);
          });
          EOF

      - name: Run structural sensitivity
        run: npx vitest run src/engine-v8/__tests__/calibration-matchup-matrix.test.ts src/engine-v8/__tests__/calibration-deck-validation.test.ts src/engine-v8/__tests__/calibration-compact-core.test.ts src/engine-v8/__tests__/tmp-cross-neutral-control.test.ts

      - name: Upload sensitivity evidence
        uses: actions/upload-artifact@v4
        with:
          name: v8-cross-structural-sensitivity
          path: test-results/v8-calibration-*
          if-no-files-found: error
          retention-days: 7
