name: V8 Cross Cost Redistribution

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Create neutral-control reporter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/engine-v8/calibration-cross-minimal.ts')
          text = path.read_text()
          old = """const CORE_CASES = [
            { id: 'beckham-wambach', core: ['beckham', 'wambach'] },
            { id: 'di-maria-wambach', core: ['di-maria', 'wambach'] },
            { id: 'dzajic-wambach', core: ['dzajic', 'wambach'] },
            { id: 'beckham-di-maria', core: ['beckham', 'di-maria'] },
            { id: 'beckham-di-maria-wambach', core: ['beckham', 'di-maria', 'wambach'] },
            { id: 'beckham-dzajic-wambach', core: ['beckham', 'dzajic', 'wambach'] },
            { id: 'di-maria-dzajic-wambach', core: ['di-maria', 'dzajic', 'wambach'] },
            { id: 'beckham-di-maria-dzajic', core: ['beckham', 'di-maria', 'dzajic'] },
          ] as const;"""
          new = """const CORE_CASES = [
            { id: 'neutral', core: [] },
            { id: 'beckham', core: ['beckham'] },
            { id: 'wambach', core: ['wambach'] },
            { id: 'di-maria', core: ['di-maria'] },
            { id: 'dzajic', core: ['dzajic'] },
            { id: 'beckham-wambach', core: ['beckham', 'wambach'] },
            { id: 'di-maria-wambach', core: ['di-maria', 'wambach'] },
            { id: 'dzajic-wambach', core: ['dzajic', 'wambach'] },
            { id: 'beckham-di-maria', core: ['beckham', 'di-maria'] },
            { id: 'beckham-di-maria-wambach', core: ['beckham', 'di-maria', 'wambach'] },
            { id: 'beckham-dzajic-wambach', core: ['beckham', 'dzajic', 'wambach'] },
            { id: 'di-maria-dzajic-wambach', core: ['di-maria', 'dzajic', 'wambach'] },
            { id: 'beckham-di-maria-dzajic', core: ['beckham', 'di-maria', 'dzajic'] },
          ] as const;"""
          if old not in text:
              raise SystemExit('CORE_CASES source did not match expected baseline')
          path.write_text(text.replace(old, new))
          PY
          cat > src/engine-v8/__tests__/tmp-cross-neutral-control.test.ts <<'EOF'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { describe, it } from 'vitest';
          import {
            V8_CROSS_MINIMAL_SEEDS,
            formatV8CrossMinimalReport,
            runV8CrossMinimalSensitivity,
          } from '../calibration-cross-minimal';

          describe('V8 Cross neutral shell control', () => {
            it('writes zero/single/pair/triple evidence', () => {
              const report = runV8CrossMinimalSensitivity(V8_CROSS_MINIMAL_SEEDS);
              const text = formatV8CrossMinimalReport(report);
              mkdirSync('test-results', { recursive: true });
              writeFileSync('test-results/v8-calibration-cross-neutral-control.json', `${JSON.stringify(report, null, 2)}\n`);
              writeFileSync('test-results/v8-calibration-cross-neutral-control.txt', `${text}\n`);
            }, 30_000);
          });
          EOF

      - name: Sweep redistribution candidates
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/engine-v8/calibration-balance.ts
          ORIGINAL=$(cat "$FILE")

          run_scenario() {
            local name="$1"
            local discount="$2"
            printf '%s' "$ORIGINAL" > "$FILE"
            DISCOUNT="$discount" python - <<'PY'
          import os
          from pathlib import Path
          path = Path('src/engine-v8/calibration-balance.ts')
          text = path.read_text()
          discount = os.environ['DISCOUNT']
          old = "export function calibrationPlayCost(card: Pick<V8CalibrationPlayerCard, 'cost'>): number {\n  return Math.max(1, card.cost - 1);\n}"
          new = f"export function calibrationPlayCost(card: Pick<V8CalibrationPlayerCard, 'id' | 'cost'>): number {{\n  if (card.id === 'wambach') return Math.max(1, card.cost);\n  if (card.id === '{discount}') return Math.max(1, card.cost - 2);\n  return Math.max(1, card.cost - 1);\n}}"
          if old not in text:
              raise SystemExit('calibrationPlayCost source did not match expected baseline')
          path.write_text(text.replace(old, new))
          PY
            rm -rf test-results
            npx vitest run src/engine-v8/__tests__/calibration-matchup-matrix.test.ts src/engine-v8/__tests__/tmp-cross-neutral-control.test.ts
            mkdir -p "sensitivity/$name"
            cp test-results/v8-calibration-matrix.json test-results/v8-calibration-matrix.txt "sensitivity/$name/"
            cp test-results/v8-calibration-cross-neutral-control.json test-results/v8-calibration-cross-neutral-control.txt "sensitivity/$name/"
          }

          run_scenario dzajic dzajic
          run_scenario hegerberg hegerberg
          run_scenario cafu cafu
          printf '%s' "$ORIGINAL" > "$FILE"

      - name: Upload sensitivity evidence
        uses: actions/upload-artifact@v4
        with:
          name: v8-cross-cost-redistribution
          path: sensitivity/
          if-no-files-found: error
          retention-days: 7
