name: V8 Cross Cost Sensitivity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Sweep compact Cross Cost candidates
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/engine-v8/calibration-balance.ts

          run_scenario() {
            local name="$1"
            local ids="$2"
            git checkout -- "$FILE"
            COST_IDS="$ids" python - <<'PY'
          import os
          from pathlib import Path
          path = Path('src/engine-v8/calibration-balance.ts')
          text = path.read_text()
          ids = [item for item in os.environ['COST_IDS'].split(',') if item]
          old = "export function calibrationPlayCost(card: Pick<V8CalibrationPlayerCard, 'cost'>): number {\n  return Math.max(1, card.cost - 1);\n}"
          listed = ', '.join(repr(item) for item in ids)
          new = f"export function calibrationPlayCost(card: Pick<V8CalibrationPlayerCard, 'id' | 'cost'>): number {{\n  if ([{listed}].includes(card.id)) return Math.max(1, card.cost);\n  return Math.max(1, card.cost - 1);\n}}"
          if old not in text:
              raise SystemExit('calibrationPlayCost source did not match expected baseline')
          path.write_text(text.replace(old, new))
          PY
            rm -rf test-results
            npx vitest run src/engine-v8/__tests__/calibration-matchup-matrix.test.ts src/engine-v8/__tests__/calibration-cross-minimal.test.ts
            mkdir -p "sensitivity/$name"
            cp test-results/v8-calibration-matrix.json test-results/v8-calibration-matrix.txt "sensitivity/$name/"
            cp test-results/v8-calibration-cross-minimal.json test-results/v8-calibration-cross-minimal.txt "sensitivity/$name/"
          }

          run_scenario beckham "beckham"
          run_scenario di_maria "di-maria"
          run_scenario wambach "wambach"
          run_scenario creators "beckham,di-maria"
          run_scenario all_three "beckham,di-maria,wambach"

          git checkout -- "$FILE"

      - name: Upload sensitivity evidence
        uses: actions/upload-artifact@v4
        with:
          name: v8-cross-cost-sensitivity
          path: sensitivity/
          if-no-files-found: error
          retention-days: 7
