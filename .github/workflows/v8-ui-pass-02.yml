name: V8 UI pass 02

on:
  push:
    branches: [agent/v8-me-ui-pass-01]
    paths:
      - .github/workflows/v8-ui-pass-02.yml
      - .github/v8-ui-pass-02.py
      - .github/v8-ui-pass-02-fix.py
      - .github/v8-ui-pass-02-debug-toggle.py
      - .github/v8-ui-pass-02-polish.py
      - .github/v8-ui-pass-02-polish-test.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-me-ui-pass-01
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Apply visual rebuild
        run: |
          python3 .github/v8-ui-pass-02.py
          python3 .github/v8-ui-pass-02-fix.py
          python3 .github/v8-ui-pass-02-debug-toggle.py
          python3 .github/v8-ui-pass-02-polish.py
          python3 .github/v8-ui-pass-02-polish-test.py
          git diff --check

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint changed UI
        run: npx eslint src/components/match-v8/V8CalibrationLab.tsx tests/v8-match-lab.spec.ts

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: ""
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve static export
        run: |
          python3 -m http.server 3001 --directory out > /tmp/kickoff-clash-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/lab/match-v8/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kickoff-clash-http.log
          exit 1

      - name: V8 mobile browser suite
        run: npx playwright test tests/v8-match-lab.spec.ts --project=chromium

      - name: Capture mobile visual
        if: always()
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await page.goto('http://127.0.0.1:3001/lab/match-v8/', { waitUntil: 'networkidle' });
            await page.screenshot({ path: 'v8-ui-pass-02.png' });
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v8-ui-pass-02-mobile
          path: v8-ui-pass-02.png

      - name: Commit verified visual rebuild
        shell: bash
        run: |
          git rm .github/v8-ui-pass-02.py
          git rm .github/v8-ui-pass-02-fix.py
          git rm .github/v8-ui-pass-02-debug-toggle.py
          git rm .github/v8-ui-pass-02-polish.py
          git rm .github/v8-ui-pass-02-polish-test.py
          git rm .github/workflows/v8-ui-pass-02.yml
          git config user.name "Neutral Working"
          git config user.email "13trianglez@gmail.com"
          git add src/components/match-v8/V8CalibrationLab.tsx src/components/match-v8/v8lab.css tests/v8-match-lab.spec.ts
          git commit -m "Rebuild V8 mobile match stage"
          git push origin HEAD:agent/v8-me-ui-pass-01
